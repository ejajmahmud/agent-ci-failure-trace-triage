[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ci-failure-trace-triage"
version = "0.1.0"
description = "CI/CD error log parser classifying failures and synthesizing actionable remediation plans"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-ci-failure-trace-triage = "agent_ci_failure_trace_triage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ci_failure_trace_triage*"]
